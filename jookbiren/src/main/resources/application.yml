spring:
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
    defer-datasource-initialization: true
  jackson:
    time-zone: Asia/Seoul

server:
  tomcat:
    threads:
      max: 200
      min-spare: 10
      max-connections: 1000
      accept-count: 100
  servlet:
    encoding:
      force-response: true

logging:
  level:
    org:
      springframework:
        orm:
          jpa: DEBUG

custom:
  image:
    url: ${CUSTOM_IMAGE_URL}

jwt:
  secret: ${JWT_SECRET_KEY}